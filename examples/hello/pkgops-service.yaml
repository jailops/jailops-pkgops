# The same daemon as pkgops.yaml, but the rc.d script and the service user are
# generated from a service: section instead of being hand-written.
#   pkgops build -f examples/hello/pkgops-service.yaml
name: hello
version: 0.1.0
origin: sysutils/hello
comment: Tiny example daemon packaged with pkgops (generated rc.d script)
desc: |
  hello answers HTTP requests with a greeting. The rc.d script that starts
  and supervises it is generated by pkgops from the service: section.
www: https://github.com/jailops/jailops-pkgops
maintainer: pkgops@jailops.net
license: BSD2CLAUSE
categories: [sysutils]
abis: [FreeBSD:15:amd64, FreeBSD:15:aarch64]

build:
  type: go
  package: ./cmd/hello
  ldflags: -s -w -X main.version=${VERSION}

files:
  - source: build/${ARCH}/hello
    destination: bin/hello
  - source: packaging/hello.conf
    destination: etc/hello/hello.conf
    config: true

service:
  name: hello
  command: /usr/local/bin/hello
  args: [-listen, "127.0.0.1:8099"]
  user: hello              # created by the package (no login shell, no home)
  restart: true            # supervise with daemon -r
  log:
    file: /var/log/hello.log
    rotate: 7              # newsyslog: daily, keep 7
