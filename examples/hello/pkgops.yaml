name: hello
version: 0.1.0
origin: sysutils/hello
comment: Tiny example daemon packaged with pkgops
desc: |
  hello answers HTTP requests with a greeting. It exists to show a Go
  daemon, an rc.d script, a config file and a service user packaged with
  pkgops, without a FreeBSD builder.
www: https://github.com/jailops/jailops-pkgops
maintainer: pkgops@jailops.net
license: BSD2CLAUSE
categories: [sysutils]
abis: [FreeBSD:15:amd64, FreeBSD:15:aarch64]
min_release: "15.1"   # pkg refuses the package on an older FreeBSD

build:
  type: go
  package: ./cmd/hello
  ldflags: -s -w -X main.version=${VERSION}

files:
  - source: build/${ARCH}/hello
    destination: bin/hello
  - source: packaging/hello.conf
    destination: etc/hello/hello.conf
    config: true

services:
  - name: hello
    source: packaging/rc.d-hello

dirs:
  - path: /var/db/hello
    owner: hello
    group: hello
    mode: 0750

users:
  - name: hello
    comment: hello daemon
    home: /var/db/hello
