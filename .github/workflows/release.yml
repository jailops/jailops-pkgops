name: release

# A tag v* makes the GitHub release: archives for linux, darwin, windows and freebsd (amd64, arm64) and
# checksums.txt (sha256). Created by `just release vX.Y.Z` (docs/releasing.md); the action in action.yml
# downloads the linux binary from this release.
on:
  push:
    tags: ["v*"]

# Nothing by default; the job gets the one scope GoReleaser needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release and its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # the changelog needs the history and the tags
          persist-credentials: false   # GoReleaser uses GITHUB_TOKEN from env, not the git credentials
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5   # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt, vet and tests on the tagged commit
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
      # every action of this workflow is pinned to a commit SHA (docs/supply-chain.md)
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a   # v6.4.0
        with:
          distribution: goreleaser
          version: "v2.18.3"   # pinned; bump deliberately
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
