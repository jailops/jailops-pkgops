name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No binaries in git
        run: sh scripts/no-binaries.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: cross-compile the CLI for FreeBSD (compile check only)
        run: |
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/pkgops
          GOOS=freebsd GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/pkgops
      - name: example package builds (no FreeBSD host involved)
        run: |
          go build -o "$RUNNER_TEMP/pkgops" ./cmd/pkgops
          cd examples/hello
          SOURCE_DATE_EPOCH=1700000000 "$RUNNER_TEMP/pkgops" build --abi FreeBSD:15:amd64 -o "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/pkgops" inspect "$RUNNER_TEMP"/dist/FreeBSD:15:amd64/hello-0.1.0.pkg

  web:
    name: web UI (build, unit tests, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: embedded UI is up to date (commit the result of npm run build)
        working-directory: .
        run: git diff --exit-code -- internal/webui/dist
      # The runner's apt mirror (azure.archive.ubuntu.com) is sometimes served by a node that trickles at tens of KB/s for
      # hours (actions/runner-images#14823): apt's own timeout only covers a stalled connection, never a slow one. So the
      # mirror is chosen by measuring: a 5 second download of the package index from each of three public mirrors, and the
      # fastest goes first in the list apt reads, the others stay as fallbacks. A download that stalls for 10 seconds is
      # dropped and apt moves to the next mirror; failed downloads are retried.
      - name: Fastest apt mirror, retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          sudo chown -R "$USER" /var/cache/apt/archives
          list=/etc/apt/apt-mirrors.txt
          [ -f "$list" ] || exit 0
          . /etc/os-release
          mirrors="http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu"
          best=""; bestspeed=0
          for m in $mirrors; do
            speed=$(curl -s -o /dev/null -w '%{speed_download}' --max-time 5 "$m/dists/$VERSION_CODENAME/main/binary-amd64/Packages.gz" || true)
            speed=${speed%%.*}
            echo "mirror $m: $(( ${speed:-0} / 1024 )) KB/s"
            if [ "${speed:-0}" -gt "$bestspeed" ]; then best=$m; bestspeed=$speed; fi
          done
          [ -n "$best" ] || exit 0
          { echo "$best priority:1"; for m in $mirrors; do [ "$m" = "$best" ] || echo "$m priority:2"; done; } | sudo tee "$list" >/dev/null
          echo "using $best"
      - name: Cache the apt packages and the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
