name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No binaries in git
        run: sh scripts/no-binaries.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: cross-compile the CLI for FreeBSD (compile check only)
        run: |
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/pkgops
          GOOS=freebsd GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/pkgops
      - name: example package builds (no FreeBSD host involved)
        run: |
          go build -o "$RUNNER_TEMP/pkgops" ./cmd/pkgops
          cd examples/hello
          SOURCE_DATE_EPOCH=1700000000 "$RUNNER_TEMP/pkgops" build --abi FreeBSD:15:amd64 -o "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP/pkgops" inspect "$RUNNER_TEMP"/dist/FreeBSD:15:amd64/hello-0.1.0.pkg

  web:
    name: web UI (build, unit tests, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: embedded UI is up to date (commit the result of npm run build)
        working-directory: .
        run: git diff --exit-code -- internal/webui/dist
      # The runner's apt mirror (azure.archive.ubuntu.com) is sometimes served by a node that trickles at tens of KB/s for
      # hours (actions/runner-images#14823): apt's own timeout only covers a stalled connection, never a slow one. So four
      # trustworthy mirrors (Canonical's three and kernel.org's edge mirror, all serving Ubuntu-signed indexes) download the
      # package index for 5 seconds at once, and the list apt reads is rewritten in speed order with every mirror kept as a
      # fallback: a download that stalls for 10 seconds is dropped and apt moves to the next mirror; failed downloads are
      # retried. The retry file keeps the image's own name, as apt.conf.d files sort and the later one wins.
      - name: Fastest apt mirror, retries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/zz-retries >/dev/null
          sudo chown -R "$USER" /var/cache/apt/archives
          list=/etc/apt/apt-mirrors.txt
          [ -f "$list" ] || exit 0
          . /etc/os-release
          mirrors="http://azure.archive.ubuntu.com/ubuntu/ https://archive.ubuntu.com/ubuntu/ https://security.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/"
          speeds=$(mktemp)
          for m in $mirrors; do
            curl -sf -o /dev/null --max-time 5 -w "%{speed_download} $m\n" "${m}dists/$VERSION_CODENAME/main/binary-amd64/Packages.gz" >>"$speeds" &
          done
          wait
          sort -rn "$speeds" | awk '{ printf "%6d KB/s  %s\n", $1 / 1024, $2 }'
          grep -qv '^0' "$speeds" || exit 0
          sort -rn "$speeds" | awk '{ printf "%s\tpriority:%d\n", $2, NR }' | sudo tee "$list" >/dev/null
      - name: Cache the apt packages and the Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
